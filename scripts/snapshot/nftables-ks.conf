#!/usr/sbin/nft -f
#
# Keysmith job-VM egress lock. Applied by cloud-init on every job VM at boot,
# BEFORE any container workload starts.
#
# The S3 spike (docs/spikes/sealed-vm.md) proved that an output-only drop is NOT
# enough: container traffic on the default Docker bridge leaves through the
# forward hook, so a runc/runsc container could still reach the internet. The fix
# is a forward chain with policy drop as well. With both chains dropping, the VM
# can never open an outbound connection; the only channel is the control VM's
# inbound SSH (established/related + new on port 22).

flush ruleset

table inet ks {
	chain output {
		type filter hook output priority 0; policy drop;
		oif "lo" accept
		ct state established,related accept
		# allow DNS/NTP during the brief boot window ONLY if you need apt at
		# boot; Keysmith bakes everything into the snapshot, so nothing is
		# needed here and the line stays commented.
		# udp dport { 53, 123 } accept
		counter comment "dropped egress"
	}

	chain forward {
		type filter hook forward priority 0; policy drop;
		ct state established,related accept
		counter comment "dropped container egress (the spike's fix)"
	}

	chain input {
		type filter hook input priority 0; policy drop;
		iif "lo" accept
		ct state established,related accept
		# inbound SSH from the control VM is the only way in.
		tcp dport 22 ct state new accept
		counter comment "dropped inbound"
	}
}
